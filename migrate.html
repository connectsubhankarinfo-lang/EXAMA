<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exama password migration</title>
<style>body{font:15px system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px}input,button{font:inherit;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}label{display:flex;gap:8px;align-items:center;margin:6px 0}label input{width:auto;margin:0}button{background:#4f46e5;color:#fff;border:0;border-radius:8px}button:disabled{opacity:.5}pre{background:#111;color:#9f9;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:50vh;overflow:auto}</style></head><body>
<h2>Exama password migration</h2>
<p>1) Log in as admin. 2) Run with <b>Preview</b> ticked. 3) Untick Preview and run again. 4) Delete this file from your host.</p>
<input id="m" placeholder="Admin mobile number" inputmode="numeric"><input id="p" type="password" placeholder="Admin password">
<input id="pre" placeholder="Collection prefix (leave empty; test_ for test mode)">
<label><input type="checkbox" id="dry" checked> Preview only (changes nothing)</label>
<label><input type="checkbox" id="force"> Also remove stored passwords that do not match the student's current login</label>
<button id="go">Start</button><pre id="log"></pre>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
import {getFirestore,collection,getDocs,updateDoc,deleteField} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
const CFG={
                apiKey: "AIzaSyBGmVplT3n_5Jrb4powBC5KAcw9ylJibGo", authDomain: "exama-cfb56.firebaseapp.com",
                projectId: "exama-cfb56", databaseURL: "https://exama-cfb56-default-rtdb.asia-southeast1.firebasedatabase.app", messagingSenderId: "670163422803",
                appId: "1:670163422803:web:20fb4d598783dbd215c0a6", measurementId: "G-GZ2L1G71QX"
            };
const $=id=>document.getElementById(id),L=t=>{$('log').textContent+=t+"\n"};
$('go').onclick=async()=>{
  const go=$('go');go.disabled=true;$('log').textContent='';
  try{
    const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app),a2=getAuth(initializeApp(CFG,'s2'));
    await signInWithEmailAndPassword(auth,$('m').value.trim()+'@exama.app',$('p').value.trim());
    L('Logged in as admin.');
    const P=$('pre').value.trim(),dry=$('dry').checked,force=$('force').checked,T={};
    for(const col of ['students','admins']){
      const snap=await getDocs(collection(db,P+col));
      for(const d of snap.docs){
        const pw=d.get('password');if(pw===undefined)continue;
        const em=d.id+'@exama.app';let st;
        if(dry){L('[preview] '+col+'/'+d.id);T.preview=(T.preview||0)+1;continue}
        try{await createUserWithEmailAndPassword(a2,em,String(pw));st='created'}
        catch(e){
          if(e.code==='auth/email-already-in-use'){try{await signInWithEmailAndPassword(a2,em,String(pw));st='already ok'}catch(e2){st='mismatch'}}
          else st=e.code==='auth/weak-password'?'weak':'error '+e.code;
        }
        try{await a2.signOut()}catch(e){}
        if(st==='created'||st==='already ok'||(st==='mismatch'&&force)){
          try{await updateDoc(d.ref,{password:deleteField()});st+=' + password removed'}catch(e){st+=' (could not remove field: '+e.code+')'}
        }else st+=' - password kept';
        L(col+'/'+d.id+': '+st);T[st]=(T[st]||0)+1;
      }
    }
    L('\nDONE. '+JSON.stringify(T));
    if(dry)L('Now untick Preview and press Start again.');
  }catch(e){L('ERROR: '+(e.code||'')+' '+e.message)}
  go.disabled=false;
};
</script></body></html>
